[project]
name = "ytdl"
version = "0.0.2"
description = "bot for download youtube shorts"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "strenum>=0.4.15",
    "yt-dlp>=2026.3.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ytdl"]
